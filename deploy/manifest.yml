# QFRemote 部署清单（S-090，2026-11-15，C-4）
# ================================================================
# 用途：一次部署要登记的服务／unit／环境变量名／端口／数据目录／
# 公钥指纹与回滚版本，一处可查。密钥值绝不进本文件——只由 secret
# store 注入（见末节“密钥”）。
# 填写规则：每项标“已核实（仓库有源）”或“待部署窗口核对”；
# 未核实的项部署时必须在服务器上实查后补填，不可凭推测填。
# 工作树基线：HEAD b943853（lea-local-agent，rc9 已冻结）。
# 部署 commit：部署时填实际部署的 commit（当前基线仅为工作树状态，
# 不是已部署版本）；线上当前运行版本：2.4.4（回滚目标）。

