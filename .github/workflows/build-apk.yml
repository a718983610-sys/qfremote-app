name: Android 未签名构建（Windows）

# QFRemote 安卓控制端：长期编译走 GitHub Actions 免费 Runner（公开仓库标准
# Runner 免费、分钟不限量；windows-latest 为 4 核 16GB，远强于 2 核 2GB
# 的腾讯云 CVM）。站长 2026-11-20 拍板；GPT 构建方向裁决（2026-11-20）
# 批准“云端构建、可信设备签名”的分工。
#
# 本工作流只做一件事：在 windows-latest 上编出未签名 release APK 并作为
# artifact 上传。Runner 上绝不出现签名密钥、key.properties 与任何口令；
# 签名在可信设备另行做（未签名 APK → 验 SHA → zipalign → apksigner）。
#
# GPT 2026-11-20 PR #1 裁决：有条件批准合并，先修 4 项再合并——PR-1 最小权限
# （只留 contents: read，复跑实证 upload-artifact）、PR-2 构建溯源（六字段）、
# PR-3 未签名判定加强（三层）、PR-4 两项非阻断告警登记；另加 workflow_dispatch
# 的 build_date 固定输入（PR 触发时仍用运行当天日期，不改构建语义）。
#
# 触发方式：手动（workflow_dispatch）为主；PR 触碰本文件时跑一次，供合并前
# 审查（GitHub 规定：workflow_dispatch 只能触发已存在于默认分支 main 上
# 的工作流，因此新工作流的首次真实试跑须走 PR 触发；自动触发（push/PR
# 改动产品代码）须在分支与签名配置问题定夺后再加，不要擅自加上）。
#
# 重要限制（2026-11-20 实测）：
# - main 分支的 build.gradle.kts 在无 key.properties 时会回退 debug 签名，
#   本工作流在 Runner 内临时把 release signingConfig 改为 null（只改
#   Runner 的工作副本，不提交进仓库），产出真正的未签名 APK；改动与核对
#   都写进日志，改不成功就直接失败，绝不静默出 debug 签名包。
# - RC 合并树（a16s2-merge-20261119，e2f6425）的 build.gradle.kts 有
#   站长 2026-11-16 终局拍板的签名硬门（taskGraph 门，无完整签名即拒绝
#   构建）。本工作流检测到该硬门时直接失败、拒绝绕过；在 RC 分支上跑
#   未签名构建，须先经 GPT/站长批准专门的未签名构建配置。
# - 本工作流不读 version.json（main 上没有该文件）；版本取自
#   android-app/pubspec.yaml（3.0.0+30000）。
on:
  workflow_dispatch:
    inputs:
      build_date:
        description: '构建日期（YYYY-MM-DD），固定且可验证的溯源输入；留空则用运行当天日期（Asia/Shanghai）'
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

# 最小权限（GPT PR-1 裁决，2026-11-20）：只保留 contents: read，
# actions: write 已去掉；upload-artifact 是否仍成功由本轮复跑实证——
# 若确有新的 API 权限要求，再按官方权限契约单独授予最小范围。
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'        # 腾讯机第 5 轮成功构建的版本（Dart 3.13.7）
  JAVA_VERSION: '21.0.13+9.0.LTS'  # Temurin JDK 21.0.13+9，腾讯机成功构建的版本；
                                   # 注意：setup-java 经 Adoptium API 解析版本，该构建在 API
                                   # 里登记为 21.0.13+9.0.LTS（java -version 只显示 21.0.13+9），
                                   # 写 '21.0.13+9' 会报 No matching version（2026-11-20 试跑实证）
  BUILD_TOOLS_VERSION: '36.0.0'    # Android SDK build-tools，腾讯机成功构建的版本
  ANDROID_PLATFORM: 'android-36'   # compileSdk = flutter.compileSdkVersion = 36
  PYTHONIOENCODING: 'utf-8'        # Windows 的 Python 默认 stdout 是 cp1252，打印中文即
                                   # UnicodeEncodeError 崩（试跑 44721581221 实证：补丁本身已
                                   # 生效，只因最后一行中文 print 崩掉整步）；强制 UTF-8。

jobs:
  build-unsigned:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 第三方 action 固定到已审查的完整 commit SHA（注释为对应版本）。
      # checkout/setup-java/flutter-action/upload-artifact 的 SHA 与
      # .github/workflows/android.yml（RC 树）一致；actions/cache 的 SHA
      # 为 v5 标签对应的 commit（gh api 核验，v5.1.0）。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 记录构建溯源（修改前，GPT PR-2）
        shell: bash
        run: |
          # 溯源身份必须在 Runner 修改任何源码前采集：本步之后，
          # “读版本”步会改 lib/build_info.dart（kBuildDate），
          # “配置未签名构建”步会改 app/build.gradle.kts。
          # pull_request 事件检出的是测试合并提交（GITHUB_SHA），
          # 不是 PR 真实 HEAD——两者都要分别记录，不能只记一个。
          CHECKED_OUT=$(git rev-parse HEAD)
          SOURCE_TREE=$(git rev-parse HEAD^{tree})
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$PR_HEAD" ] && PR_HEAD="not-a-pr-run"
          [ -z "$BASE" ] && BASE="not-a-pr-run"
          echo "CHECKED_OUT_COMMIT=$CHECKED_OUT" >> "$GITHUB_ENV"
          echo "PR_HEAD_COMMIT=$PR_HEAD" >> "$GITHUB_ENV"
          echo "BASE_COMMIT=$BASE" >> "$GITHUB_ENV"
          echo "SOURCE_TREE_SHA=$SOURCE_TREE" >> "$GITHUB_ENV"
          echo "checked_out_commit: $CHECKED_OUT"
          echo "pr_head_commit: $PR_HEAD"
          echo "base_commit: $BASE"
          echo "source_tree_sha: $SOURCE_TREE"

      - name: Java ${{ env.JAVA_VERSION }}（Temurin）
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Android SDK 包
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          SDKM=""
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          else
            SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager.bat 2>/dev/null | sort -V | tail -1)
          fi
          [ -n "$SDKM" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION"
          echo "已装 build-tools："
          ls "$ANDROID_HOME/build-tools"

      - name: Flutter ${{ env.FLUTTER_VERSION }}（Dart 3.13.7）
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-${{ hashFiles('android-app/android/gradle/wrapper/gradle-wrapper.properties', 'android-app/android/settings.gradle.kts', 'android-app/android/app/build.gradle.kts', 'android-app/pubspec.lock') }}
          restore-keys: |
            gradle-windows-

      - name: 工具链自检
        shell: bash
        run: |
          flutter --version
          java -version 2>&1
          python --version
          flutter doctor -v || true

      - name: 读版本（pubspec.yaml）并写入构建日期
        shell: bash
        working-directory: android-app
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/[[:space:]]*$//')
          echo "APP_VERSION=${VER%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${VER##*+}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "pubspec version: $VER"
          # 构建日期输入（GPT 建议）：workflow_dispatch 可传固定 build_date
          # （YYYY-MM-DD，固定且可验证）；留空或 PR 触发时仍用运行当天日期，
          # 不改构建语义。日期与来源记入 sidecar 供溯源。
          if [ -n "${{ inputs.build_date }}" ]; then
            D="${{ inputs.build_date }}"
            BUILD_DATE_SOURCE="workflow_dispatch input"
          else
            D=$(TZ=Asia/Shanghai date +%F)
            BUILD_DATE_SOURCE="run date (Asia/Shanghai)"
          fi
          echo "$D" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::build_date 格式须为 YYYY-MM-DD，当前：$D"; exit 1; }
          echo "BUILD_DATE=$D" >> "$GITHUB_ENV"
          echo "BUILD_DATE_SOURCE=$BUILD_DATE_SOURCE" >> "$GITHUB_ENV"
          echo "kBuildDate: $D（来源：$BUILD_DATE_SOURCE）"
          sed -i "s/const String kBuildDate = '.*';/const String kBuildDate = '$D';/" lib/build_info.dart
          grep kBuildDate lib/build_info.dart

      - name: 配置未签名 release 构建（Runner 内临时修改，不提交）
        shell: bash
        working-directory: android-app/android
        run: |
          python - <<'PYEOF'
          import sys
          p = 'app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          # RC 树签名硬门：检测到即拒绝，须另行批准未签名构建配置。
          if 'Release signing is missing' in s or 'releaseSigningComplete' in s:
              print('::error::检测到 RC 树签名硬门（taskGraph 门）。本工作流未获授权绕过；')
              print('::error::须先经 GPT/站长批准“未签名 release 构建配置”后才能在该分支上跑。')
              sys.exit(1)
          old = '''        release {
                      signingConfig = if (keystorePropertiesFile.exists()) {
                          signingConfigs.getByName("release")
                      } else {
                          signingConfigs.getByName("debug")
                      }
                  }'''
          new = '''        release {
                      // CI 未签名构建（本工作流只产未签名包，签名在可信设备另行做）：
                      // 明确拒绝 debug 签名回退；signingConfig = null 生成真正未签名 APK。
                      signingConfig = null
                  }'''
          if old not in s:
              print('::error::未识别的 build.gradle.kts release 配置，拒绝继续（防静默出 debug 签名包）。')
              sys.exit(1)
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          s2 = open(p, encoding='utf-8').read()
          assert 'signingConfig = null' in s2, '补丁未生效'
          assert 'getByName("debug")' not in s2, 'debug 签名回退仍在'
          print('已将 release signingConfig 改为 null（Runner 内临时修改，不提交）。')
          PYEOF
          git diff -- app/build.gradle.kts
          # 构建配置改动身份（GPT PR-2）：此时工作树已有两处 Runner 临时修改
          # （lib/build_info.dart 的 kBuildDate＋本步的 signingConfig），
          # 取全量 git diff 的 SHA-256 作为 build_config_patch_sha。
          PATCH_SHA=$(git diff | sha256sum | awk '{print $1}')
          echo "BUILD_CONFIG_PATCH_SHA=$PATCH_SHA" >> "$GITHUB_ENV"
          echo "build_config_patch_sha: $PATCH_SHA"
          echo "本次构建对源码的临时改动（两处）："
          git diff --stat

      - name: 拉依赖
        shell: bash
        working-directory: android-app
        run: flutter pub get

      - name: 静态检查
        shell: bash
        working-directory: android-app
        run: flutter analyze

      - name: 单元测试
        shell: bash
        working-directory: android-app
        run: flutter test

      - name: 构建未签名 release APK
        shell: bash
        working-directory: android-app
        run: |
          # 输出 tee 到 build-output.log，供验包步检测已知非阻断告警
          # （CI-KOTLIN-CACHE-WARNING）；pipefail 保证构建失败仍使本步失败。
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-output.log

      - name: 验包（未签名三层判定 + 版本 + SHA + 溯源记录）
        shell: bash
        working-directory: android-app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "::error::未找到产物 $APK"; exit 1; }
          ls -la "$APK"
          BT="$BUILD_TOOLS_VERSION"
          echo "build-tools: $BT"
          BADGING=$("$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK")
          echo "$BADGING" | head -3
          echo "$BADGING" | grep -q "package: name='com.qfremote.android'" || { echo "::error::包名不符"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='30000'" || { echo "::error::versionCode 不符（期望 30000）"; exit 1; }
          echo "$BADGING" | grep -q "versionName='3.0.0'" || { echo "::error::versionName 不符（期望 3.0.0）"; exit 1; }
          # 未签名判定第 1 层（结构）：APK 顶层 META-INF 内不得有 v1 签名块文件
          # （*.RSA/*.DSA/*.EC/*.SF）。只查顶层、只查这四种后缀、行尾锚定。
          # 教训（试跑 44723007019 实证）：依赖库会自带嵌套的 MANIFEST.MF
          # （如 META-INF/versions/9/OSGI-INF/MANIFEST.MF，145 字节 OSGi
          # 元数据）与大量 .version/.properties 文件——都不是签名；旧断言
          # 把 .MF 一概当签名块且未锚定行尾，误杀了这个合法的未签名包。
          # MANIFEST.MF 本身不是签名（v1 签名 = .SF + 密钥文件）。
          echo "META-INF 清单（备查）："
          unzip -l "$APK" | grep -E 'META-INF/' || true
          if unzip -l "$APK" | awk '{print $4}' | grep -qE '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "::error::产物含 v1 签名块，不是未签名包，拒绝上传"
            exit 1
          fi
          echo "未签名判定第 1 层通过：APK 顶层 META-INF 内无 v1 签名块"
          # 未签名判定第 2 层（结构，Python）：APK 签名块魔数＋全包证书文件扫描。
          # v2/v3/v4 签名块的魔数 "APK Sig Block 42" 必须不存在；任何
          # .RSA/.DSA/.EC/.SF 文件（证书/签名文件）必须不存在。本地已对
          # run5/run6 产物实测通过（无魔数、无此类文件）。
          python - <<'PYEOF'
          import sys, zipfile, re
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          data = open(apk, 'rb').read()
          if b'APK Sig Block 42' in data:
              print('::error::产物含 APK 签名块（v2/v3/v4），不是未签名包，拒绝上传')
              sys.exit(1)
          z = zipfile.ZipFile(apk)
          certs = [n for n in z.namelist() if re.search(r'\.(RSA|DSA|EC|SF)$', n, re.I)]
          if certs:
              print('::error::产物含证书/签名文件：%s，拒绝上传' % certs)
              sys.exit(1)
          print('未签名判定第 2 层通过：无 APK 签名块、无任何证书/签名文件')
          PYEOF
          # 未签名判定第 3 层（权威校验，GPT PR-3）：apksigner verify --verbose。
          # 只看“校验返回非零”不够——签名存在但损坏也会失败；必须核对失败的
          # 明确原因。本轮 apksigner 36.0.0 在失败时只输出两行（试跑
          # 44731964516 实证）：“DOES NOT VERIFY”＋“ERROR: Missing
          # META-INF/MANIFEST.MF”，没有“Number of signers: N”这一行——
          # 不要再断言它。缺失 MANIFEST 本身就是明确原因：该包根本没有
          # v1 签名结构；v2/v3/v4 签名块的有无由第 2 层魔数扫描判定。
          # 另用 jarsigner（JDK 自带）作第二方明确判定：输出须含
          # “jar is unsigned.”（本地已对 run6 产物实测：jarsigner 退出 0，
          # 输出含 “no manifest.” 与 “jar is unsigned.”）。
          # 注意（试跑 44725118334 实证）：Windows 的 build-tools 里只有
          # apksigner.bat、没有 apksigner 可执行文件；直接调 apksigner
          # 会报 No such file（退出 127），旧写法把“命令不存在”误读成
          # “校验失败”——那一轮的 apksigner 证据无效。因此先断言二进制
          # 存在，再要求输出含 DOES NOT VERIFY 与 ERROR: Missing
          # META-INF/MANIFEST.MF，并要求 jarsigner 明确判未签名；缺
          # 二进制或输出不对都直接失败，绝不把“没跑起来”当成“未签名”。
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner.bat"
          test -f "$APKSIGNER" || { echo "::error::找不到 apksigner.bat：$APKSIGNER"; exit 1; }
          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)
          echo "$VERIFY_OUT"
          echo "$VERIFY_OUT" | grep -q "DOES NOT VERIFY" || { echo "::error::apksigner 输出不含 DOES NOT VERIFY，无法证明未签名，拒绝上传"; exit 1; }
          echo "$VERIFY_OUT" | grep -q "ERROR: Missing META-INF/MANIFEST.MF" || { echo "::error::apksigner 未给出明确失败原因（期望 ERROR: Missing META-INF/MANIFEST.MF），拒绝上传"; exit 1; }
          echo "未签名判定第 3 层（apksigner）通过：明确失败原因——无 v1 清单（Missing META-INF/MANIFEST.MF）"
          command -v jarsigner >/dev/null 2>&1 || { echo "::error::找不到 jarsigner（JDK 自带，应在 PATH 内）"; exit 1; }
          JARSIGNER_OUT=$(jarsigner -verify "$APK" 2>&1 || true)
          echo "$JARSIGNER_OUT" | tail -3
          echo "$JARSIGNER_OUT" | grep -q "jar is unsigned." || { echo "::error::jarsigner 未明确判定未签名（期望 jar is unsigned.），拒绝上传"; exit 1; }
          echo "未签名判定第 3 层（jarsigner）通过：jar is unsigned."
          echo "三层判定全过，本产物统一标识为 UNSIGNED_BUILD_ONLY（不是 RELEASE_SIGNED，也不是 RC_APPROVED）"
          # 已知非阻断告警检测（GPT PR-4）：Kotlin 增量缓存关闭异常在本轮
          # 构建输出中出现即登记；Gradle 缓存保存失败发生在 Post 步骤，
          # 步骤内无法采集，记 unknown-post-step，复验时从运行日志核对。
          if grep -q "Could not close incremental caches" build-output.log; then
            KOTLIN_WARN_DETECTED=true
            echo "::warning::检测到已知非阻断告警 CI-KOTLIN-CACHE-WARNING（Kotlin 增量缓存关闭异常），已登记，不阻止合并"
          else
            KOTLIN_WARN_DETECTED=false
            echo "本轮构建输出中未出现 CI-KOTLIN-CACHE-WARNING"
          fi
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          echo "SHA-256: $SHA"
          echo "大小: $SIZE 字节"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          cp "$APK" "build/app/outputs/flutter-apk/QFRemote-v$APP_VERSION-unsigned-$SHORT_SHA.apk"
          cat > "build/app/outputs/flutter-apk/build-unsigned.json" <<EOF
