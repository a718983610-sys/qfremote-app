name: Android 未签名构建（Windows）

# QFRemote 安卓控制端：长期编译走 GitHub Actions 免费 Runner（公开仓库标准
# Runner 免费、分钟不限量；windows-latest 为 4 核 16GB，远强于 2 核 2GB
# 的腾讯云 CVM）。站长 2026-11-20 拍板；GPT 构建方向裁决（2026-11-20）
# 批准“云端构建、可信设备签名”的分工。
#
# 本工作流只做一件事：在 windows-latest 上编出未签名 release APK 并作为
# artifact 上传。Runner 上绝不出现签名密钥、key.properties 与任何口令；
# 签名在可信设备另行做（未签名 APK → 验 SHA → zipalign → apksigner）。
#
# 触发方式：手动（workflow_dispatch）为主；PR 触碰本文件时跑一次，供合并前
# 审查（GitHub 规定：workflow_dispatch 只能触发已存在于默认分支 main 上
# 的工作流，因此新工作流的首次真实试跑须走 PR 触发；自动触发（push/PR
# 改动产品代码）须在分支与签名配置问题定夺后再加，不要擅自加上）。
#
# 重要限制（2026-11-20 实测）：
# - main 分支的 build.gradle.kts 在无 key.properties 时会回退 debug 签名，
#   本工作流在 Runner 内临时把 release signingConfig 改为 null（只改
#   Runner 的工作副本，不提交进仓库），产出真正的未签名 APK；改动与核对
#   都写进日志，改不成功就直接失败，绝不静默出 debug 签名包。
# - RC 合并树（a16s2-merge-20261119，e2f6425）的 build.gradle.kts 有
#   站长 2026-11-16 终局拍板的签名硬门（taskGraph 门，无完整签名即拒绝
#   构建）。本工作流检测到该硬门时直接失败、拒绝绕过；在 RC 分支上跑
#   未签名构建，须先经 GPT/站长批准专门的未签名构建配置。
# - 本工作流不读 version.json（main 上没有该文件）；版本取自
#   android-app/pubspec.yaml（3.0.0+30000）。
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

# 最小权限。actions: write 是上传构建产物所必需的最小写权限。
permissions:
  contents: read
  actions: write

env:
  FLUTTER_VERSION: '3.47.8'        # 腾讯机第 5 轮成功构建的版本（Dart 3.13.7）
  JAVA_VERSION: '21.0.13+9.0.LTS'  # Temurin JDK 21.0.13+9，腾讯机成功构建的版本；
                                   # 注意：setup-java 经 Adoptium API 解析版本，该构建在 API
                                   # 里登记为 21.0.13+9.0.LTS（java -version 只显示 21.0.13+9），
                                   # 写 '21.0.13+9' 会报 No matching version（2026-11-20 试跑实证）
  BUILD_TOOLS_VERSION: '36.0.0'    # Android SDK build-tools，腾讯机成功构建的版本
  ANDROID_PLATFORM: 'android-36'   # compileSdk = flutter.compileSdkVersion = 36
  PYTHONIOENCODING: 'utf-8'        # Windows 的 Python 默认 stdout 是 cp1252，打印中文即
                                   # UnicodeEncodeError 崩（试跑 44721581221 实证：补丁本身已
                                   # 生效，只因最后一行中文 print 崩掉整步）；强制 UTF-8。

jobs:
  build-unsigned:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 第三方 action 固定到已审查的完整 commit SHA（注释为对应版本）。
      # checkout/setup-java/flutter-action/upload-artifact 的 SHA 与
      # .github/workflows/android.yml（RC 树）一致；actions/cache 的 SHA
      # 为 v5 标签对应的 commit（gh api 核验，v5.1.0）。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Java ${{ env.JAVA_VERSION }}（Temurin）
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Android SDK 包
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          SDKM=""
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          else
            SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager.bat 2>/dev/null | sort -V | tail -1)
          fi
          [ -n "$SDKM" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION"
          echo "已装 build-tools："
          ls "$ANDROID_HOME/build-tools"

      - name: Flutter ${{ env.FLUTTER_VERSION }}（Dart 3.13.7）
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-${{ hashFiles('android-app/android/gradle/wrapper/gradle-wrapper.properties', 'android-app/android/settings.gradle.kts', 'android-app/android/app/build.gradle.kts', 'android-app/pubspec.lock') }}
          restore-keys: |
            gradle-windows-

      - name: 工具链自检
        shell: bash
        run: |
          flutter --version
          java -version 2>&1
          python --version
          flutter doctor -v || true

      - name: 读版本（pubspec.yaml）并写入构建日期
        shell: bash
        working-directory: android-app
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/[[:space:]]*$//')
          echo "APP_VERSION=${VER%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${VER##*+}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "pubspec version: $VER"
          D=$(TZ=Asia/Shanghai date +%F)
          sed -i "s/const String kBuildDate = '.*';/const String kBuildDate = '$D';/" lib/build_info.dart
          grep kBuildDate lib/build_info.dart

      - name: 配置未签名 release 构建（Runner 内临时修改，不提交）
        shell: bash
        working-directory: android-app/android
        run: |
          python - <<'PYEOF'
          import sys
          p = 'app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          # RC 树签名硬门：检测到即拒绝，须另行批准未签名构建配置。
          if 'Release signing is missing' in s or 'releaseSigningComplete' in s:
              print('::error::检测到 RC 树签名硬门（taskGraph 门）。本工作流未获授权绕过；')
              print('::error::须先经 GPT/站长批准“未签名 release 构建配置”后才能在该分支上跑。')
              sys.exit(1)
          old = '''        release {
                      signingConfig = if (keystorePropertiesFile.exists()) {
                          signingConfigs.getByName("release")
                      } else {
                          signingConfigs.getByName("debug")
                      }
                  }'''
          new = '''        release {
                      // CI 未签名构建（本工作流只产未签名包，签名在可信设备另行做）：
                      // 明确拒绝 debug 签名回退；signingConfig = null 生成真正未签名 APK。
                      signingConfig = null
                  }'''
          if old not in s:
              print('::error::未识别的 build.gradle.kts release 配置，拒绝继续（防静默出 debug 签名包）。')
              sys.exit(1)
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          s2 = open(p, encoding='utf-8').read()
          assert 'signingConfig = null' in s2, '补丁未生效'
          assert 'getByName("debug")' not in s2, 'debug 签名回退仍在'
          print('已将 release signingConfig 改为 null（Runner 内临时修改，不提交）。')
          PYEOF
          git diff -- app/build.gradle.kts

      - name: 拉依赖
        shell: bash
        working-directory: android-app
        run: flutter pub get

      - name: 静态检查
        shell: bash
        working-directory: android-app
        run: flutter analyze

      - name: 单元测试
        shell: bash
        working-directory: android-app
        run: flutter test

      - name: 构建未签名 release APK
        shell: bash
        working-directory: android-app
        run: flutter build apk --release

      - name: 验包（未签名断言 + 版本 + SHA）
        shell: bash
        working-directory: android-app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "::error::未找到产物 $APK"; exit 1; }
          ls -la "$APK"
          BT="$BUILD_TOOLS_VERSION"
          echo "build-tools: $BT"
          BADGING=$("$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK")
          echo "$BADGING" | head -3
          echo "$BADGING" | grep -q "package: name='com.qfremote.android'" || { echo "::error::包名不符"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='30000'" || { echo "::error::versionCode 不符（期望 30000）"; exit 1; }
          echo "$BADGING" | grep -q "versionName='3.0.0'" || { echo "::error::versionName 不符（期望 3.0.0）"; exit 1; }
          # 未签名断言（结构层）：APK 顶层 META-INF 内不得有 v1 签名块文件
          # （*.RSA/*.DSA/*.EC/*.SF）。只查顶层、只查这四种后缀、行尾锚定。
          # 教训（试跑 44723007019 实证）：依赖库会自带嵌套的 MANIFEST.MF
          # （如 META-INF/versions/9/OSGI-INF/MANIFEST.MF，145 字节 OSGi
          # 元数据）与大量 .version/.properties 文件——都不是签名；旧断言
          # 把 .MF 一概当签名块且未锚定行尾，误杀了这个合法的未签名包。
          # MANIFEST.MF 本身不是签名（v1 签名 = .SF + 密钥文件）；真正的
          # 未签名判定以下面的 apksigner verify 为准（覆盖 v1/v2/v3/v4）。
          echo "META-INF 清单（备查）："
          unzip -l "$APK" | grep -E 'META-INF/' || true
          if unzip -l "$APK" | awk '{print $4}' | grep -qE '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "::error::产物含 v1 签名块，不是未签名包，拒绝上传"
            exit 1
          fi
          echo "未签名断言通过：APK 顶层 META-INF 内无 v1 签名块"
          # apksigner 应校验失败（未签名是预期状态，只记录，不当作错误）。
          if "$ANDROID_HOME/build-tools/$BT/apksigner" verify "$APK" 2>&1; then
            echo "::error::apksigner 竟校验通过，产物并非未签名，拒绝上传"
            exit 1
          else
            echo "apksigner 校验失败（符合未签名预期）"
          fi
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          echo "SHA-256: $SHA"
          echo "大小: $SIZE 字节"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          cp "$APK" "build/app/outputs/flutter-apk/QFRemote-v$APP_VERSION-unsigned-$SHORT_SHA.apk"
          cat > "build/app/outputs/flutter-apk/build-unsigned.json" <<EOF
          {"version": "$APP_VERSION", "channel": "unsigned", "commit": "$GITHUB_SHA", "built_at": "$(TZ=Asia/Shanghai date +%FT%T%z)", "artifact": "QFRemote-v$APP_VERSION-unsigned-$SHORT_SHA.apk", "sha256": "$SHA", "size_bytes": $SIZE, "note": "未签名 release APK，须在可信设备 zipalign 后用正式密钥 apksigner 签名，验签通过后才可作 RC 候选；绝不直接分发。"}
          EOF
          cat build/app/outputs/flutter-apk/build-unsigned.json

      - name: 上传未签名产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: QFRemote-v${{ env.APP_VERSION }}-unsigned-${{ env.SHORT_SHA }}-apk
          path: |
            android-app/build/app/outputs/flutter-apk/QFRemote-v${{ env.APP_VERSION }}-unsigned-${{ env.SHORT_SHA }}.apk
            android-app/build/app/outputs/flutter-apk/build-unsigned.json
          if-no-files-found: error
