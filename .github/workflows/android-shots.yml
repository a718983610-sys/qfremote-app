name: Android 截图与看护实测

# 模拟器里跑一遍：正式包启动画面/真实登录页 + 测试包看护/更新/断线/主题截图。
# 只手动触发，不跟着推送跑（耗时）。
on:
  workflow_dispatch:

# S-100/S-101：最小权限。actions: write 是上传截图产物所必需的最小写权限
#（原 actions: read 下 upload-artifact 拿不到写授权）。
permissions:
  contents: read
  actions: write

# S-096：Flutter 版本单一变量复用——改这里即改全部步骤，不再各处写死。
env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # S-101：第三方 action 固定到已审查的完整 commit SHA（注释为对应 release 版）。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 释放 runner 磁盘（模拟器步曾因 No space left on device 失败，2026-10-25 F-2）
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: 开 KVM 硬件加速（Linux 模拟器必需）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 下载最新正式包产物（截图里装的就是它）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "期望版本（version.json 单一源）: $APP_VERSION"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          export PATH="$ANDROID_HOME/build-tools/$BT:$PATH"
          bash .github/scripts/fetch-prod-apk.sh \
            --repo ${{ github.repository }} --workflow android.yml \
            --expected-version "$APP_VERSION" --package com.qfremote.android \
            --out-dir prod
          ls -la prod/

      - name: 编译测试包（指向本机夹具服务器）
        working-directory: android-app
        run: |
          flutter pub get
          flutter build apk --debug \
            --dart-define=QF_TEST_URL=http://10.0.2.2:8791/start.html \
            --dart-define=QF_RELEASE_URL=http://10.0.2.2:8791/release.json

      - name: 起夹具服务器（宿主机 8791）
        run: |
          nohup python3 android-app/tool/fixture_server.py android-app/build/app/outputs/flutter-apk/app-debug.apk > /tmp/fixture.log 2>&1 &
          sleep 2
          curl -s http://127.0.0.1:8791/release.json | head -c 200; echo

      - name: 模拟器里跑截图与看护实测
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-app/tool/run_shots.sh

      - name: 上传预览图与日志
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qfremote-android-previews
          path: shots/
          if-no-files-found: warn
