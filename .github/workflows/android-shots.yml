name: Android 截图与看护实测

# 模拟器里跑一遍：正式包启动画面/真实登录页 + 测试包看护/更新/断线/主题截图。
# 只手动触发，不跟着推送跑（耗时）。
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 开 KVM 硬件加速（Linux 模拟器必需）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.32.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: 下载最新正式包产物（截图里装的就是它）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow android.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "build run: $RUN_ID"
          gh run download "$RUN_ID" --repo ${{ github.repository }} -n QFRemote-v2.0.0-apk -D prod
          ls -la prod/

      - name: 编译测试包（指向本机夹具服务器）
        working-directory: android-app
        run: |
          flutter pub get
          flutter build apk --debug \
            --dart-define=QF_TEST_URL=http://10.0.2.2:8791/start.html \
            --dart-define=QF_RELEASE_URL=http://10.0.2.2:8791/release.json

      - name: 起夹具服务器（宿主机 8791）
        run: |
          nohup python3 android-app/tool/fixture_server.py android-app/build/app/outputs/flutter-apk/app-debug.apk > /tmp/fixture.log 2>&1 &
          sleep 2
          curl -s http://127.0.0.1:8791/release.json | head -c 200; echo

      - name: 模拟器里跑截图与看护实测
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-app/tool/run_shots.sh

      - name: 上传预览图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfremote-android-previews
          path: shots/
          if-no-files-found: warn
