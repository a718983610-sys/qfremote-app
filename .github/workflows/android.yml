name: Android 正式构建

# QFRemote 安卓控制端：云端编译 + 专属签名出 release APK。
# 手动触发（workflow_dispatch）；推送到 main 且改动 android-app/ 时也自动跑。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.7（2026-10 最新稳定版，Dart 3.13.5）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 写入构建日期（北京时间）
        working-directory: android-app
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          sed -i "s/const String kBuildDate = '.*';/const String kBuildDate = '$D';/" lib/build_info.dart
          grep kBuildDate lib/build_info.dart

      - name: 放入签名密钥（仓库 Secret 解码，不进仓库）
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/qfremote-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=qfremote-release.jks
          EOF
          ls -la android/app/qfremote-release.jks android/key.properties

      - name: 拉依赖
        working-directory: android-app
        run: flutter pub get

      - name: 静态检查
        working-directory: android-app
        run: flutter analyze

      - name: 单元测试
        working-directory: android-app
        run: flutter test

      - name: 构建 release APK（专属签名）
        working-directory: android-app
        run: flutter build apk --release

      - name: 验包（包名/版本/签名指纹）
        working-directory: android-app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | head -3
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" build/app/outputs/flutter-apk/QFRemote-v2.2.0.apk
          ls -la build/app/outputs/flutter-apk/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QFRemote-v2.2.0-apk
          path: android-app/build/app/outputs/flutter-apk/QFRemote-v2.2.0.apk
          if-no-files-found: error
