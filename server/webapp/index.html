<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- theme-color 由 applyTheme 从 --bg token 写入（W-01：HTML 内不留色值字面量） -->
<meta name="color-scheme" content="light dark">
<meta name="description" content="QFRemote 控制台 3.0：远程桌面、文件管理与聊天。">
<title>QFRemote 控制台</title>
<!-- W-04 首屏 boot data 注入点：服务端渲染时把下一行替换为 window.__QF_BOOT__ 内联脚本；静态直出时无害，客户端走原有缓存＋校验流程。实现见 server/webapp/boot-data.mjs，接线见 BOOT-DATA.md。 -->
<!-- QF_BOOT_DATA -->
<script>
/* G8 深色偏好预应用（防闪白）：app.js 加载前先落 data-theme；有存储偏好用存储值，无存储偏好跟随系统主题（2026-11-14 站长明确） */
try { var _t = localStorage.getItem('qf-theme'); if (_t === 'dark' || _t === 'light') { document.documentElement.setAttribute('data-theme', _t); } else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.setAttribute('data-theme', 'dark'); } } catch (e) {}
</script>
<link rel="stylesheet" href="qf-tokens-dfccb65a.css">
<link rel="stylesheet" href="app-9a9df23b.css">
<link rel="stylesheet" href="session-7938edee.css">
<link rel="icon" type="image/x-icon" href="favicon-a2404f9a.ico">
</head>
<body>
  <!-- 未登录区（登录 / 注册 / 拦截状态：单卡布局，无顶栏） -->
  <div id="authRoot" hidden></div>

  <!-- 登录区（统一壳：桌面固定边栏 / 移动单行顶栏＋底部导航，视图同框切换） -->
  <div id="shellRoot" hidden>
    <div class="app">
      <aside class="side" id="sidebar"></aside>
      <div class="main">
        <div class="top">
          <button class="burger" id="burgerBtn" aria-label="打开主菜单"></button>
          <div class="search" id="topSearch"></div>
          <div class="grow"></div>
          <span class="online" id="svcState"><i></i>服务检测中</span>
          <button class="iconbtn" id="bellBtn" aria-label="通知"></button>
          <span class="acctwrap">
            <button class="uchip" id="acctChip"></button>
            <span class="acctmenu" id="acctMenu"></span>
          </span>
        </div>
        <main id="view" aria-live="polite"></main>
        <div class="foot">QFRemote 3.0 · 让远程连接更简单</div>
      </div>
    </div>
    <div class="dscrim" id="drawerScrim" aria-hidden="true"></div>
    <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="主菜单"></aside>
    <nav class="bnav" id="bnav"></nav>
  </div>

  <!-- 提示层（恒在最上层）与弹窗层 -->
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <!-- 启动兜底（W4-2）：app.js 加载或执行失败时不白页；显根后自动隐藏，10 秒未显根换失败文案 -->
  <div id="bootFail" class="bootfail"><span id="bootMsg">正在加载控制台，请稍候…</span></div>
  <noscript><div class="bootfail-noscript">本站需要启用 JavaScript 才能使用，请开启后刷新页面。</div></noscript>
  <script>
  (function(){
    var b=document.getElementById('bootFail'), m=document.getElementById('bootMsg'), n=0;
    var t=setInterval(function(){
      var a=document.getElementById('authRoot'), s=document.getElementById('shellRoot');
      if((a&&!a.hidden)||(s&&!s.hidden)){ b.style.display='none'; clearInterval(t); return; }
      n++;
      if(n===20&&m){ m.innerHTML='页面未能加载，可能是网络异常或浏览器版本过低。<br><a href="./" class="boot-link">点此刷新重试</a>'; }
    },500);
  })();
  </script>

  <!-- S-080（2026-11-15）：服务状态灯接真实健康探活。此前灯是写死的“服务正常”，
       从不变化（CSS .online.bad 红灯变体永不触发）。今每 60 秒 fetch 同源
       /health（nginx -> ext 8448 的 GET /health，回 {ok:true}，no-store），
       失败（非 2xx／超时 5 秒／断网）即红灯“服务异常”，恢复即回绿灯。
       灯在 #shellRoot 内（登录后才可见），探活本身登录前也在跑。 -->
  <script>
  (function(){
    var el = document.getElementById('svcState');
    if (!el || typeof fetch !== 'function') return;
    function set(ok){
      el.classList.toggle('bad', !ok);
      el.innerHTML = '<i></i>' + (ok ? '服务正常' : '服务异常');
    }
    function probe(){
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var timer = null;
      if (ctl) timer = setTimeout(function(){ try { ctl.abort(); } catch (e) {} }, 5000);
      fetch('/health', { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
        .then(function(r){ if (timer) clearTimeout(timer); return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
        .then(function(j){ set(!!j && j.ok === true); })
        .catch(function(){ if (timer) clearTimeout(timer); set(false); });
    }
    probe();
    setInterval(probe, 60000);
  })();
  </script>

<script src="qf-schema-0c938b14.js"></script>

</body>
</html>
