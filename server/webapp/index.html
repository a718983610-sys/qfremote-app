<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QFRemote 控制台</title>
<link rel="stylesheet" href="app.css?v=20261110-245">
<link rel="stylesheet" href="session.css?v=20261110-245">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=20261026-34">
</head>
<body>
  <!-- 未登录区（登录 / 注册 / 拦截状态：单卡布局，无顶栏） -->
  <div id="authRoot" hidden></div>

  <!-- 登录区（统一壳：桌面固定边栏 / 移动单行顶栏＋底部导航，视图同框切换） -->
  <div id="shellRoot" hidden>
    <div class="app">
      <aside class="side" id="sidebar"></aside>
      <div class="main">
        <div class="top">
          <button class="burger" id="burgerBtn" aria-label="打开主菜单"></button>
          <div class="search" id="topSearch"></div>
          <div class="grow"></div>
          <span class="online" id="svcState"><i></i>服务正常</span>
          <button class="iconbtn" id="bellBtn" aria-label="通知"></button>
          <span class="acctwrap">
            <button class="uchip" id="acctChip"></button>
            <span class="acctmenu" id="acctMenu"></span>
          </span>
        </div>
        <main id="view" aria-live="polite"></main>
        <div class="foot">QFRemote · 让远程连接更简单</div>
      </div>
    </div>
    <div class="dscrim" id="drawerScrim" aria-hidden="true"></div>
    <aside class="drawer" id="drawer" aria-hidden="true"></aside>
    <nav class="bnav" id="bnav"></nav>
  </div>

  <!-- 提示层（恒在最上层）与弹窗层 -->
  <div id="toasts" role="status"></div>
  <div id="modalRoot"></div>

  <!-- 启动兜底（W4-2）：app.js 加载或执行失败时不白页；显根后自动隐藏，10 秒未显根换失败文案 -->
  <div id="bootFail" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#5D6E84;text-align:center;padding:48px 16px;font-size:14px;line-height:1.7"><span id="bootMsg">正在加载控制台，请稍候…</span></div>
  <noscript><div style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#5D6E84;text-align:center;padding:0 16px 32px;font-size:14px">本站需要启用 JavaScript 才能使用，请开启后刷新页面。</div></noscript>
  <script>
  (function(){
    var b=document.getElementById('bootFail'), m=document.getElementById('bootMsg'), n=0;
    var t=setInterval(function(){
      var a=document.getElementById('authRoot'), s=document.getElementById('shellRoot');
      if((a&&!a.hidden)||(s&&!s.hidden)){ b.style.display='none'; clearInterval(t); return; }
      n++;
      if(n===20&&m){ m.innerHTML='页面未能加载，可能是网络异常或浏览器版本过低。<br><a href="./" style="color:#2470E0">点此刷新重试</a>'; }
    },500);
  })();
  </script>

<script src="app.js?v=20261112-fe5fc008"></script>
</body>
</html>
