# QFRemote 边缘安全头（S-078 纳入仓库；S-088 统一由边缘输出）
# ================================================================
# 部署：随 qfremote-proxy 一并拷到 /etc/nginx/qfremote-proxy-headers.conf，
# 部署清单（deploy/manifest.yml）登记本文件 hash，部署后以 nginx -T
# 输出做指纹比对。修改前须核对线上 /etc/nginx 同名文件——本文件是
# 仓库正本，线上若有手工改动须先合进来，不可直接覆盖。
#
# 注意：
# - 全站 CSP 此处故意不设：控制台（MeshCentral）含内联脚本，直接上
#   CSP 会断功能；如需 CSP 须先做 nonce 改造，另立项（见 PROXY-CONTRACTS.md）。
# - X-Frame-Options SAMEORIGIN：控制台用同源 iframe 嵌会话
#   （/console-engine/），DENY 会断会话；跨源嵌仍被拦。
# - HSTS：公网唯一入口是 Cloudflare HTTPS 隧道；若 Cloudflare 侧已发
#   HSTS，部署时去掉本行，避免重复头。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
