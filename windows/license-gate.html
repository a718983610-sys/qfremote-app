<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; height:100%; }
  body {
    background:#f4f7fb; color:#1f2d47; overflow-y:auto;
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  html[data-theme="dark"] body { background:#17181c; color:#eceff3; }
  .wrap { max-width:560px; margin:0 auto; padding:34px 22px 30px; box-sizing:border-box; }
  .logo { width:54px; height:54px; border-radius:14px; margin:0 auto; padding:3px;
    background:#0b2b5b; box-sizing:border-box; }
  html[data-theme="dark"] .logo { background:#ffffff; }
  .logo img { width:100%; height:100%; border-radius:11px; display:block; }
  h1 { font-size:20px; font-weight:800; text-align:center; margin:14px 0 6px; }
  .acct { text-align:center; font-size:13px; color:#6b7a90; margin:0 0 16px; }
  html[data-theme="dark"] .acct { color:#9aa1ab; }
  .card { background:#ffffff; border:1px solid #dfe7f2; border-radius:14px;
    padding:15px 16px; font-size:14.5px; line-height:1.65; }
  html[data-theme="dark"] .card { background:#22262e; border-color:rgba(255,255,255,.08); }
  .guide { font-size:13px; line-height:1.6; color:#6b7a90; margin:12px 2px 0; }
  html[data-theme="dark"] .guide { color:#9aa1ab; }
  .claim { margin-top:16px; }
  .claim label { display:block; font-size:14px; font-weight:700; margin-bottom:10px; }
  .claim input {
    width:100%; box-sizing:border-box; font-family:inherit; font-size:14px;
    padding:11px 12px; border-radius:10px; border:1px solid #c9d6ea;
    background:#ffffff; color:#1f2d47; text-transform:uppercase;
  }
  html[data-theme="dark"] .claim input { background:#2b2f36; color:#eceff3; border-color:rgba(255,255,255,.16); }
  .claim input:focus-visible, button:focus-visible { outline:2px solid #2470e0; outline-offset:2px; }
  .out { font-size:13.5px; line-height:1.55; margin-top:10px; min-height:0; }
  .out:empty { display:none; }
  .btn {
    width:100%; border:none; cursor:pointer; font-family:inherit; margin-top:12px;
    font-size:15px; font-weight:700; color:#fff; padding:12px 0; border-radius:11px;
    background:#2470e0; transition:filter .15s ease, opacity .15s;
  }
  .btn:hover { filter:brightness(1.07); }
  .btn:disabled { opacity:.55; cursor:default; filter:none; }
  .row { display:flex; justify-content:center; gap:4px; margin-top:8px; flex-wrap:wrap; }
  .link {
    appearance:none; background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:14px; color:#2470e0; padding:10px 12px; border-radius:8px;
  }
  .link:hover { background:rgba(36,112,224,.08); }
  .link.danger { color:#d3382c; }
  html[data-theme="dark"] .link.danger { color:#ff9d8f; }
  .err { text-align:center; font-size:13px; color:#d3382c; margin-top:10px; }
  html[data-theme="dark"] .err { color:#ff9d8f; }
  .err:empty { display:none; }
  @media (prefers-reduced-motion: reduce) { .btn { transition:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="build/icon.png" alt="QFRemote"></div>
    <h1 id="title">暂时无法登录</h1>
    <p class="acct" id="acct"></p>
    <div class="card" id="bodyText"></div>
    <p class="guide" id="guide" style="display:none;"></p>
    <div class="card claim" id="claimBox" style="display:none;">
      <label for="claimInput" id="claimLabel">请输入 QFRemote 激活密钥</label>
      <input id="claimInput" type="text" maxlength="40" autocomplete="off"
             autocapitalize="characters" spellcheck="false" placeholder="粘贴完整密钥串">
      <button class="btn" id="claimBtn">领取密钥</button>
      <div class="out" id="claimOut" role="status"></div>
    </div>
    <button class="btn" id="primaryBtn" style="display:none;"></button>
    <div class="row" id="rebindRow" style="display:none;margin-top:2px;">
      <button class="link" id="rebindBtn">申诉换绑设备</button>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="row">
      <button class="link" id="recheckBtn">重新检查状态</button>
      <button class="link" id="supportBtn">咨询智能客服</button>
      <button class="link danger" id="logoutBtn">退出账号</button>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  function applyTheme(t) {
    if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
  }
  applyTheme(q.get('t') || 'blue');
  if (window.qfGate && qfGate.onTheme) qfGate.onTheme(applyTheme);

  const titleEl = document.getElementById('title');
  const acctEl = document.getElementById('acct');
  const bodyEl = document.getElementById('bodyText');
  const guideEl = document.getElementById('guide');
  const claimBox = document.getElementById('claimBox');
  const claimInput = document.getElementById('claimInput');
  const claimBtn = document.getElementById('claimBtn');
  const claimOut = document.getElementById('claimOut');
  const primaryBtn = document.getElementById('primaryBtn');
  const errEl = document.getElementById('err');
  let state = null;

  function render(s) {
    if (!s || !s.copy) return;
    state = s;
    titleEl.textContent = s.copy.title;
    acctEl.textContent = s.username ? '当前账号：' + s.username : '';
    bodyEl.textContent = s.copy.body;
    if (s.copy.hasTransferGuide) {
      guideEl.textContent = s.guideText || '';
      guideEl.style.display = s.guideText ? '' : 'none';
    } else guideEl.style.display = 'none';
    claimBox.style.display = s.copy.hasClaimBox ? '' : 'none';
    if (s.copy.hasClaimBox) setTimeout(() => { try { claimInput.focus(); } catch (e) {} }, 60);
    if (s.copy.primary === 'purchase') { primaryBtn.textContent = '前往购买'; primaryBtn.style.display = ''; }
    else if (s.copy.primary === 'appeal') { primaryBtn.textContent = '提交申诉'; primaryBtn.style.display = ''; }
    else primaryBtn.style.display = 'none';
    document.getElementById('rebindRow').style.display = s.copy.hasRebind ? '' : 'none';
  }
  document.getElementById('rebindBtn').addEventListener('click', () => { if (window.qfGate) qfGate.open('rebind'); });
  if (window.qfGate) {
    qfGate.onState(render);
    qfGate.getState().then(render).catch(() => {});
  }

  let claimBusy = false;
  async function submitClaim() {
    if (claimBusy || !window.qfGate) return;
    claimBusy = true;
    claimBtn.disabled = true;
    claimBtn.textContent = '正在领取…';
    claimOut.textContent = '';
    errEl.textContent = '';
    try {
      const r = await qfGate.claim(claimInput.value);
      if (r && r.display) claimOut.textContent = r.display;
      if (r && r.ok) claimInput.value = '';
    } catch (e) {
      claimOut.textContent = '网络异常，请稍后再试。';
    }
    claimBusy = false;
    claimBtn.disabled = false;
    claimBtn.textContent = '领取密钥';
  }
  claimBtn.addEventListener('click', submitClaim);
  claimInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitClaim(); });

  primaryBtn.addEventListener('click', () => {
    if (!state || !window.qfGate) return;
    if (state.copy.primary === 'purchase') qfGate.open('purchase');
    else if (state.copy.primary === 'appeal') qfGate.open('appeal');
  });
  document.getElementById('supportBtn').addEventListener('click', () => { if (window.qfGate) qfGate.open('support'); });
  document.getElementById('recheckBtn').addEventListener('click', async () => {
    if (!window.qfGate) return;
    errEl.textContent = '';
    try {
      const r = await qfGate.recheck();
      if (r && !r.ok && r.error) errEl.textContent = r.error;
    } catch (e) { errEl.textContent = '许可信息读取失败，请检查网络后重试。'; }
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await qfGate.logout(); } catch (e) { /* 主进程确认框取消时无动作 */ }
  });
</script>
</body>
</html>
