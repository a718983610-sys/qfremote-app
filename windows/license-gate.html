<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>许可证 · QFRemote</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text-1); overflow-y:auto;
    -webkit-user-select:none; user-select:none;
  }
  /* 重做 A §4：撤销六项②深色合并——卡片用 BG2，与页面 BG0 靠 hairline + e1 分离。 */
  body { animation: win-in var(--d5) var(--e-l) both; }
  .wrap { max-width:480px; margin:0 auto; padding:24px; box-sizing:border-box; }
  /* W4 M 档：60／圆角 14／padding 4／内图圆角 10（原 54／3，六档之一） */
  .logo { width:60px; height:60px; border-radius:14px; margin:0 auto; padding:4px;
    background:var(--tile-bg); box-sizing:border-box; }
  .logo img { width:100%; height:100%; border-radius:10px; display:block; }
  h1 { font-size:24px; font-weight:600; line-height:32px; text-align:center; margin:16px 0 8px; }
  .acct { text-align:center; font-size:13px; color:var(--text-2); margin:0 0 16px; line-height:20px; }
  .card { background:var(--bg2); border:1px solid var(--line); border-radius:12px;
    padding:20px; font-size:14px; line-height:22px; }
  /* C §2.4：许可详情行（机器码 mono 分组 / 状态 chip / 有效期 / 席位）——无接口字段的显示 — */
  .meta { margin-top:16px; }
  .meta .mrow { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:20px; }
  .meta .mrow:last-child { border-bottom:none; }
  .meta .mk { color:var(--text-2); flex:none; }
  .meta .mv { font-weight:500; text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .meta .mv.mono { font-family:var(--font-mono); font-size:13px; line-height:20px; letter-spacing:.02em; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border:1px solid var(--line); border-radius:999px; background:var(--bg3); font-size:12px; line-height:18px; font-weight:500; }
  .chip::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--text-3); flex:none; }
  details.fp { margin-top:16px; padding:12px 20px; border:1px solid var(--line); border-radius:12px; background:var(--bg2); font-size:12px; line-height:18px; color:var(--text-2); }
  details.fp summary { cursor:pointer; font-size:13px; line-height:20px; font-weight:500; color:var(--text-1); }
  details.fp .fpv { font-family:var(--font-mono); font-size:13px; line-height:20px; margin-top:8px; word-break:break-all; }
  .guide { font-size:13px; line-height:1.6; color:var(--text-2); margin:12px 0 0; }
  .claim { margin-top:16px; }
  .claim label { display:block; font-size:14px; font-weight:600; margin-bottom:8px; }
  .claim input {
    width:100%; height:40px; box-sizing:border-box; font-family:inherit; font-size:14px; line-height:22px;
    padding:8px 12px; border-radius:var(--radius-1); border:1px solid var(--line);
    background:var(--surface-3); color:var(--text-1); text-transform:uppercase;
  }
  html[data-theme="dark"] .claim input { border-color:var(--line); }
  .out { font-size:14px; line-height:1.55; margin-top:10px; min-height:0; }
  .out:empty { display:none; }
  .btn {
    width:100%; border:none; cursor:pointer; font-family:inherit; margin-top:12px;
    font-size:14px; font-weight:600; color:var(--on-brand); height:40px; padding:0; border-radius:var(--radius-1);
    background:var(--brand); transition:background var(--d1) var(--e-c), transform var(--d0) var(--e-s), opacity var(--d1) var(--e-c);
  }
  .btn:hover { filter:none; background:var(--brand-press); }
  .btn:active { transform: scale(.985); }
  .btn:disabled { background:var(--bg3); color:var(--text-disabled); cursor:default; filter:none; transform:none; }
  .row { display:flex; justify-content:center; gap:4px; margin-top:8px; flex-wrap:wrap; }
  /* 链接行（定夺 §3.3）：主文字色＋始终下划线，hover 下划线变主文字色；退出账号保留 danger 色 */
  .link {
    appearance:none; background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:14px; line-height:22px; color:var(--link); padding:8px 12px; min-height:36px; display:inline-flex; align-items:center; border-radius:8px;
    text-decoration:underline; text-decoration-color:var(--link-underline);
  }
  .link:hover { background:rgba(var(--brand-rgb),.08); text-decoration-color:var(--link); }
  .link.danger { color:var(--danger); text-decoration-color:rgba(var(--danger-rgb),.55); }
  .link.danger:hover { text-decoration-color:var(--danger); }
  .err { text-align:center; font-size:13px; line-height:20px; color:var(--text-1); margin-top:10px; } /* Q1-2(a)：错误行文字中性墨色，红点已在 ::before */
  .err::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--danger); margin-right:6px; vertical-align:middle; }
  .err:empty::before { display:none; }
  .err:empty { display:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="build/icon.png" alt="QFRemote"></div>
    <h1 id="title">暂时无法登录</h1>
    <p class="acct" id="acct"></p>
    <div class="card" id="bodyText"></div>
    <!-- C §2.4 许可详情：账号来自拦截状态（真实）；机器码 / 有效期 / 席位无下发字段，显示 —，见重做报告缺数据清单 -->
    <div class="card meta" id="metaCard">
      <div class="mrow"><span class="mk">账号</span><span class="mv" id="metaAcct">—</span></div>
      <div class="mrow"><span class="mk">机器码</span><span class="mv mono" id="metaCode">—</span></div>
      <div class="mrow"><span class="mk">状态</span><span class="mv"><span class="chip" id="metaChip">—</span></span></div>
      <div class="mrow"><span class="mk">有效期</span><span class="mv" id="metaExpire">—</span></div>
      <div class="mrow"><span class="mk">席位</span><span class="mv" id="metaSlots">—</span></div>
    </div>
    <details class="fp"><summary>硬件指纹</summary><div class="fpv">本机设备码未接入显示接口 —</div></details>
    <p class="guide" id="guide" style="display:none;"></p>
    <div class="card claim" id="claimBox" style="display:none;">
      <label for="claimInput" id="claimLabel">请输入 QFRemote 激活密钥</label>
      <input id="claimInput" type="text" maxlength="40" autocomplete="off"
             autocapitalize="characters" spellcheck="false" placeholder="粘贴完整密钥串">
      <button class="btn" id="claimBtn">领取密钥</button>
      <div class="out" id="claimOut" role="status"></div>
    </div>
    <button class="btn" id="primaryBtn" style="display:none;"></button>
    <div class="row" id="rebindRow" style="display:none;margin-top:2px;">
      <button class="link" id="rebindBtn">申诉换绑设备</button>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="row">
      <button class="link" id="recheckBtn">重新检查状态</button>
      <button class="link" id="supportBtn">咨询智能客服</button>
      <button class="link danger" id="logoutBtn">退出账号</button>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  function applyTheme(t) {
    if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
  }
  applyTheme(q.get('t') || 'blue');
  if (window.qfGate && qfGate.onTheme) qfGate.onTheme(applyTheme);

  const titleEl = document.getElementById('title');
  const acctEl = document.getElementById('acct');
  const bodyEl = document.getElementById('bodyText');
  const guideEl = document.getElementById('guide');
  const claimBox = document.getElementById('claimBox');
  const claimInput = document.getElementById('claimInput');
  const claimBtn = document.getElementById('claimBtn');
  const claimOut = document.getElementById('claimOut');
  const primaryBtn = document.getElementById('primaryBtn');
  const errEl = document.getElementById('err');
  let state = null;

  function render(s) {
    if (!s || !s.copy) return;
    state = s;
    titleEl.textContent = s.copy.title;
    acctEl.textContent = s.username ? '当前账号：' + s.username : '';
    document.getElementById('metaAcct').textContent = s.username || '—';
    bodyEl.textContent = s.copy.body;
    if (s.copy.hasTransferGuide) {
      guideEl.textContent = s.guideText || '';
      guideEl.style.display = s.guideText ? '' : 'none';
    } else guideEl.style.display = 'none';
    claimBox.style.display = s.copy.hasClaimBox ? '' : 'none';
    if (s.copy.hasClaimBox) setTimeout(() => { try { claimInput.focus(); } catch (e) {} }, 60);
    if (s.copy.primary === 'purchase') { primaryBtn.textContent = '前往购买'; primaryBtn.style.display = ''; }
    else if (s.copy.primary === 'appeal') { primaryBtn.textContent = '提交申诉'; primaryBtn.style.display = ''; }
    else primaryBtn.style.display = 'none';
    document.getElementById('rebindRow').style.display = s.copy.hasRebind ? '' : 'none';
  }
  document.getElementById('rebindBtn').addEventListener('click', () => { if (window.qfGate) qfGate.open('rebind'); });
  if (window.qfGate) {
    qfGate.onState(render);
    qfGate.getState().then(render).catch(() => {});
  }

  let claimBusy = false;
  async function submitClaim() {
    if (claimBusy || !window.qfGate) return;
    claimBusy = true;
    claimBtn.disabled = true;
    claimBtn.textContent = '正在领取…';
    claimOut.textContent = '';
    errEl.textContent = '';
    try {
      const r = await qfGate.claim(claimInput.value);
      if (r && r.display) claimOut.textContent = r.display;
      if (r && r.ok) claimInput.value = '';
    } catch (e) {
      claimOut.textContent = '网络异常，请稍后再试。';
    }
    claimBusy = false;
    claimBtn.disabled = false;
    claimBtn.textContent = '领取密钥';
  }
  claimBtn.addEventListener('click', submitClaim);
  claimInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitClaim(); });

  primaryBtn.addEventListener('click', () => {
    if (!state || !window.qfGate) return;
    if (state.copy.primary === 'purchase') qfGate.open('purchase');
    else if (state.copy.primary === 'appeal') qfGate.open('appeal');
  });
  document.getElementById('supportBtn').addEventListener('click', () => { if (window.qfGate) qfGate.open('support'); });
  document.getElementById('recheckBtn').addEventListener('click', async () => {
    if (!window.qfGate) return;
    errEl.textContent = '';
    try {
      const r = await qfGate.recheck();
      if (r && !r.ok && r.error) errEl.textContent = r.error;
    } catch (e) { errEl.textContent = '许可信息读取失败，请检查网络后重试。'; }
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await qfGate.logout(); } catch (e) { /* 主进程确认框取消时无动作 */ }
  });
</script>
</body>
</html>
