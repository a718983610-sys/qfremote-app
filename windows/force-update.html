<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>更新 QFRemote</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height:100%; overflow:hidden; }
  body {
    background: var(--bg);
    animation: win-in var(--d5) var(--e-l) both;
    -webkit-user-select:none; user-select:none; color:var(--text-1); position:relative;
    display:flex; flex-direction:column;
  }
  /* 重做 A §4：撤销六项②深色合并——卡片用 BG2，与页面 BG0 靠 hairline + e1 分离。 */
  .head { -webkit-app-region: drag; display:flex; align-items:flex-start; padding:24px 24px 0; }
  .tile {
    width:60px; height:60px; border-radius:14px; padding:4px; flex:none; background:var(--tile-bg);
    box-sizing:border-box;
  }
  .tile img { width:100%; height:100%; border-radius:10px; display:block; }
  .tt { margin-left:16px; padding-top:4px; }
  .tt .nm { font-size:24px; font-weight:600; letter-spacing:.8px; line-height:32px; }
  .tt .ds { font-size:12px; color:var(--text-2); margin-top:5px; }
  .card {
    margin:16px 24px 0; padding:20px;
    background: var(--bg2);
    border: 1px solid var(--line); border-radius:12px;
    /* 排版批1（P23）：卡片作滚动区——长更新说明在卡内滚，进度条/结果/按钮/页脚常驻窗内 */
    flex:0 1 auto; min-height:0; overflow-y:auto;
  }
  .head, .bar, .res, .act, .act2 { flex:none; }
  .vrow { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--text-1); }
  .vrow .arr { color:var(--warning); font-weight:600; } /* Q1-2(a)：箭头是图形分隔符，保留警告色；版本号文字 .to 已改中性墨色 */
  .vrow .to { color:var(--text-1); }
  .notes { margin-top:12px; font-size:14px; line-height:22px; color:var(--text-1); white-space:pre-wrap; max-height:220px; overflow-y:auto; }
  html[data-theme="dark"] .notes { color:var(--text-2); }
  .bar { display:none; height:8px; border-radius:99px; margin:16px 24px 0;
    background: var(--line); overflow:hidden; }
  .bar.show { display:block; }
  .bar i { display:block; height:100%; width:0%; border-radius:99px;
    background: var(--brand); transition: width var(--d2) linear; }
  html[data-theme="dark"] .bar { background: var(--line); }
  .res { margin:16px 24px 0; font-size:13px; line-height:1.6; min-height:22px; text-align:center;
    color:var(--text-2); font-variant-numeric: tabular-nums; }
  /* Q1-2(a)（2026-11-15）：小字状态文一律中性墨色，状态色只做 6px 点 */
  .res .ok { color:var(--text-1); font-weight:600; }
  .res .ok::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success); margin-right:6px; vertical-align:middle; }
  .res .bad { color:var(--text-1); font-weight:600; }
  .res .bad::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--danger); margin-right:6px; vertical-align:middle; }
  .act { padding:0 24px; margin-top:16px; }
  .btn {
    width:100%; border:none; cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:600; color:var(--on-brand); letter-spacing:1px;
    padding:12px 0; border-radius:var(--radius-1);
    background: var(--brand);
    transition: background var(--d1) var(--e-c), transform var(--d0) var(--e-s), opacity var(--d1) var(--e-c);
  }
  .btn:hover { filter:none; background:var(--brand-press); }
  .btn:active { transform: scale(.985); }
  .btn:disabled { background:var(--bg3); color:var(--text-disabled); cursor:default; transform:none; filter:none; }
  .act2 { display:flex; justify-content:center; padding:0 24px; margin-top:8px; }
  /* 先进入软件链接（定夺 §3.3）：主文字色＋始终下划线，hover 下划线变主文字色；蓝色已去掉 */
  .btn2 { background:none; border:none; color:var(--link); font-size:13px; cursor:pointer; text-decoration:underline; text-decoration-color:var(--link-underline); padding:8px 12px; min-height:36px; }
  .btn2:hover { text-decoration-color:var(--link); }
  .hidden { display:none !important; }
  .foot { margin-top:auto; padding:0 24px 16px; text-align:center;
    font-size:12px; line-height:1.6; color:var(--text-2); }

</style>
</head>
<body>
  <div class="head">
    <div class="tile"><img src="build/icon.png" alt="QFRemote"></div>
    <div class="tt">
      <div class="nm">需要先更新</div>
      <div class="ds">QFRemote 发现新版本，先更新再使用</div>
    </div>
  </div>

  <div class="card">
    <div class="vrow"><span id="vFrom">当前版本 —</span><span class="arr">→</span><span class="to" id="vTo">新版本 —</span></div>
    <div class="notes" id="vNotes"></div>
  </div>

  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="res" id="res"></div>
  <div class="act"><button class="btn" id="forceBtn">立即更新</button></div>
  <div class="act2"><button class="btn2 hidden" id="releaseBtn">下载失败？先进入软件，下次再更新</button></div>

  <div class="foot">更新完成后才能继续使用 QFRemote；若下载失败，可先进入软件，下次打开时再更新。<br>下载后自动核对完整性（SHA256），通过后才可安装。</div>

<script>
  const q = new URLSearchParams(location.search);
  function applyTheme(t) {
    if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
  }
  applyTheme(q.get('t') || 'blue');
  const fromV = q.get('from') || '—';
  const toV = q.get('to') || '—';
  document.getElementById('vFrom').textContent = '当前版本 v' + fromV;
  document.getElementById('vTo').textContent = '新版本 v' + toV;
  document.getElementById('vNotes').textContent = q.get('notes') || '';

  const res = document.getElementById('res');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const btn = document.getElementById('forceBtn');
  function fmtSize(n) {
    if (!n && n !== 0) return '';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
    return n + ' B';
  }
  const sizeTxt = q.get('size') ? '（安装包 ' + fmtSize(parseInt(q.get('size'), 10)) + '）' : '';
  res.textContent = '点「立即更新」下载新版本' + sizeTxt + '；安装完成后重新打开即为新版本。';

  let phase = 'ready';
  // W-12②：下载中 60 秒无进度即放行——显示「先进入软件」按钮（不再只等失败）。
  let lastProgressAt = 0;
  setInterval(() => {
    if (phase === 'downloading' && lastProgressAt && Date.now() - lastProgressAt > 60000) {
      document.getElementById('releaseBtn').classList.remove('hidden');
    }
  }, 1000);
  function render(s) {
    if (!s) return;
    phase = s.phase;
    if (s.phase === 'downloading') {
      btn.disabled = true; btn.textContent = '正在下载…';
      bar.classList.add('show');
      lastProgressAt = Date.now();
    } else if (s.phase === 'downloaded') {
      btn.disabled = false; btn.textContent = '安装更新并重启';
      fill.style.width = '100%';
      // S-010：错误文／状态文不用 innerHTML 拼串，改 DOM 节点＋textContent。
      res.textContent = '';
      const okEl = document.createElement('span'); okEl.className = 'ok'; okEl.textContent = '下载完成，完整性核对通过';
      res.append(okEl, document.createTextNode('（SHA256 一致）。点「安装更新并重启」后将自动安装至当前位置，无需选择文件夹；安装完成后重新打开 QFRemote 即为新版本。'));
    } else if (s.phase === 'installing') {
      btn.disabled = true; btn.textContent = '正在安装…';
      fill.style.width = '100%';
      res.textContent = '正在安装更新，软件即将重启；安装完成后重新打开 QFRemote 即为新版本。';
    } else if (s.phase === 'failed') {
      btn.disabled = false; btn.textContent = '重新下载';
      res.textContent = '';
      const badEl = document.createElement('span'); badEl.className = 'bad'; badEl.textContent = '下载失败';
      res.append(badEl, document.createTextNode('：' + (s.error || '未知原因') + '请点「重新下载」重试；也可以先进入软件，下次打开时再更新。'));
      document.getElementById('releaseBtn').classList.remove('hidden');
    }
    if (s.phase === 'downloaded' || s.phase === 'installing') document.getElementById('releaseBtn').classList.add('hidden');
  }
  document.getElementById('releaseBtn').addEventListener('click', () => { if (window.qfForce && qfForce.release) qfForce.release(); });
  qfForce.onState(render);
  qfForce.getState().then(render).catch(() => {});
  qfForce.onProgress((p) => {
    lastProgressAt = Date.now();
    if (p.percent != null) {
      fill.style.width = p.percent + '%';
      res.textContent = '正在下载更新包… ' + p.percent + '%（' + fmtSize(p.received) + (p.total ? ' / ' + fmtSize(p.total) : '') + '）';
    } else {
      res.textContent = '正在下载更新包… 已下载 ' + fmtSize(p.received);
    }
  });
  btn.addEventListener('click', () => {
    if (phase === 'downloaded') { qfForce.openInstaller(); return; }
    btn.disabled = true; btn.textContent = '正在下载…';
    bar.classList.add('show'); fill.style.width = '0%';
    res.textContent = '正在下载更新包…';
    lastProgressAt = Date.now();
    qfForce.download();
  });
  // 这一页没有关闭按钮、正常路径没有跳过：Esc 不关窗；唯一出口是下载失败后的「先进入软件」（站长 2026-10-25 令：异常必须放行）
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') e.preventDefault(); });
</script>
</body>
</html>
