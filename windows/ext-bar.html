<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--surface-3); color:var(--text-1); box-sizing:border-box;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:0 12px;
    -webkit-user-select:none; user-select:none;
  }
  button {
    appearance:none; border:1px solid var(--btn-line); background:var(--bg2); color:var(--text-1);
    border-radius:8px; cursor:pointer; font-family:inherit; font-size:13px; line-height:20px;
    height:32px; padding:0 12px; display:flex; align-items:center; gap:6px; flex:none;
    transition: background var(--d1) var(--e-c), transform var(--d0) var(--e-s);
  }
  button:active { transform: scale(.985); }
  button:disabled { color: var(--text-disabled); }
  button:hover { background:var(--hover-ov); }
  .title { font-size:14px; font-weight:600; line-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
</style>
</head>
<body>
  <button id="back" title="返回上一面"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>返回</button>
  <span class="title" id="title">网页</span>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('t') === 'dark') document.documentElement.dataset.theme = 'dark';
  const titleEl = document.getElementById('title');
  if (q.get('title')) titleEl.textContent = q.get('title');
  if (window.qfExtBar) {
    qfExtBar.onState((s) => { if (s && s.title) titleEl.textContent = s.title; });
    qfExtBar.onTheme((t) => {
      if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      else delete document.documentElement.dataset.theme;
    });
  }
  document.getElementById('back').addEventListener('click', () => { if (window.qfExtBar) qfExtBar.back(); });
</script>
</body>
</html>
