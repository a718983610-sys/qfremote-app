<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    /* 亮蓝主题（默认）：平涂品牌蓝，细底线收口 */
    --fg:#eaf3ff;
    --fg-dim: rgba(220,236,255,.72);
    --zlabel:#dceaff;
    --hover: rgba(255,255,255,.13);
    --press: rgba(255,255,255,.22);
    --sep: rgba(255,255,255,.22);
    --status-bg: rgba(8,28,66,.42);
    --status-border: rgba(255,180,84,.4);
    --status-fg:#ffd9a0;
    --pdetail-fg: rgba(233,243,255,.92);
    --toast-ok-bg: #12703c;
    --toast-bad-bg: #b3372f;
    background: #2470e0;
    border-bottom: 1px solid rgba(6,24,58,.30);
    box-sizing: border-box;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display:flex; align-items:center; gap:4px; padding:0 6px 0 12px;
    -webkit-user-select:none; user-select:none;
    -webkit-app-region: drag; color:var(--fg);
    position:relative;
  }
  body.theme-dark {
    /* 深灰深色主题（不用纯黑，对齐家族深色卡 #22262E） */
    --fg:#eceff3;
    --fg-dim: rgba(228,232,238,.60);
    --zlabel:#c9ced6;
    --hover: rgba(255,255,255,.09);
    --press: rgba(255,255,255,.17);
    --sep: rgba(255,255,255,.13);
    --status-bg: rgba(0,0,0,.38);
    --status-border: rgba(255,180,84,.35);
    --status-fg:#ffd9a0;
    --pdetail-fg: rgba(238,241,245,.92);
    background: #22262e;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand { display:flex; align-items:center; gap:9px; margin-right:10px; }
  .brand .tile { width:29px; height:29px; border-radius:8px; background:#fff; padding:2.5px;
    box-sizing:border-box; }
  .brand .tile img { width:100%; height:100%; border-radius:6px; display:block; }
  .brand .nm { font-size:15px; font-weight:600; letter-spacing:.5px; line-height:1; }
  .brand .ver { font-size:11px; color:var(--fg-dim); margin-top:3px; line-height:1; letter-spacing:.4px; }
  .grp { display:flex; align-items:center; gap:3px; }
  .sep { width:1px; height:22px; background:var(--sep); margin:0 7px; flex:none; }
  button {
    -webkit-app-region: no-drag; appearance:none; border:1px solid transparent;
    background: transparent; color:var(--fg); border-radius:8px; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; justify-content:center; gap:5px;
    height:32px; min-width:32px; padding:0 6px; font-size:13px;
    transition: background .13s ease, border-color .13s ease;
  }
  button:hover { background: var(--hover); }
  button:active { background: var(--press); }
  button:focus-visible { outline:2px solid rgba(255,255,255,.85); outline-offset:1px; }
  button.on { background: rgba(255,159,46,.26); border-color: rgba(255,180,84,.6); color:#ffe1b0; }
  button svg { width:18px; height:18px; flex:none; }
  button:disabled { opacity:.4; cursor:default; }
  .zlabel { -webkit-app-region: no-drag; min-width:42px; text-align:center;
    font-size:12px; color:var(--zlabel); font-variant-numeric: tabular-nums; }
  .spacer { flex:1; }
  .status {
    -webkit-app-region: no-drag; display:none; align-items:center; gap:7px;
    font-size:12px; color:var(--status-fg); background: var(--status-bg);
    border:1px solid var(--status-border); border-radius:999px; padding:4px 12px; margin-right:6px;
    white-space:nowrap;
  }
  .status.show { display:flex; }
  .status .dot { width:8px; height:8px; border-radius:50%;
    background: #ff8a1e;
    animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,150,40,.5);} 55% { box-shadow: 0 0 0 6px rgba(255,150,40,0);} }
  /* 服务器状态灯：平涂色点（绿/红/橙） */
  .probe { min-width:30px; padding:0 5px; }
  .probe .pdot { width:11px; height:11px; border-radius:50%; flex:none;
    background: #f5a623; }
  .probe.ok .pdot { background: #1db954; }
  .probe.bad .pdot { background: #e5484d; }
  .pdetail {
    -webkit-app-region: no-drag; display:none; font-size:12px; color:var(--pdetail-fg);
    white-space:nowrap; font-variant-numeric: tabular-nums;
  }
  .pdetail.show { display:block; }
  .al { -webkit-app-region: no-drag; display:flex; align-items:center; gap:7px; cursor:pointer;
    font-size:13px; color:var(--fg); padding:5px 9px; border-radius:8px; border:1px solid transparent; }
  .al:hover { background: var(--hover); }
  .al input { accent-color:#ff9f2e; width:14px; height:14px; margin:0; cursor:pointer; }
  .winbtn { min-width:40px; }
  .winbtn.close:hover { background:#d3382c; color:#fff; }
  /* 截图反馈：一行小字，居中浮现，几秒后自动消失 */
  #toast {
    position:fixed; left:50%; top:7px; transform:translateX(-50%) translateY(-4px);
    z-index:50; pointer-events:none; opacity:0; transition: opacity .18s ease, transform .18s ease;
    font-size:13px; color:#fff; border-radius:999px; padding:6px 16px; white-space:nowrap;
    background: var(--toast-ok-bg);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.bad { background: var(--toast-bad-bg); }
  /* 有新版提示徽标：平涂家族橙 */
  .updbadge {
    display:none; align-items:center; gap:6px; height:30px; padding:0 12px; margin-right:6px;
    border-radius:999px; border:1px solid rgba(255,213,141,.55); cursor:pointer;
    background: #ff8a1e; color:#fff;
    font-size:13px; font-weight:700; letter-spacing:.4px; white-space:nowrap;
    transition: filter .13s ease;
  }
  .updbadge:hover { filter: brightness(1.07); }
  .updbadge.show { display:flex; }
  .updbadge .udot { width:8px; height:8px; border-radius:50%; background:#fff;
    animation: pulse 1.5s ease-in-out infinite; }
  /* 窄窗适配（排版批1 P22：原 8 档乱序逐个藏字重排为有序三档）：
     >1240 全显——默认窗宽 1280 在此档，服务器详情、重连文字、新版徽标文字常态可见；
     ≤1240 收瞬时/次要文字（服务器详情行、徽标字、管理字；悬停 title 与点击详情仍在）；
     ≤1020 图标化（品牌名、首页/好友文字、缩放百分比、重连文字、自启文字收起，
     只留图标/状态点/勾选框）；收起一律用 display:none，不再用 font-size:0 藏字；
     窗口三键任何档都不收。 */
  @media (max-width: 1240px) {
    .pdetail { display:none !important; }
    #updBadgeTx { display:none; }
    .updbadge { padding:0 9px; }
    #adminBtn > span { display:none; }
  }
  @media (max-width: 1020px) {
    body { gap:2px; padding-left:8px; }
    .sep { margin:0 4px; }
    .brand > span:last-child { display:none; }
    .brand { margin-right:2px; }
    #navHomePage > span { display:none; }
    button[onclick*="friends"] > span { display:none; }
    .zlabel { display:none; }
    .status { gap:0; padding:4px 9px; }
    .status .status-tx { display:none; }
    .al { gap:0; padding:5px 6px; }
    .al .al-tx { display:none; }
    button[onclick*="'reset'"] { display:none; }
  }
</style>
</head>
<body>
  <span class="brand">
    <span class="tile"><img src="build/icon.png" alt=""></span>
    <span><div class="nm">QFRemote</div><div class="ver" id="ver"></div></span>
  </span>

  <span class="grp">
    <button onclick="qfNav.go('back')" title="后退"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <button onclick="qfNav.go('forward')" title="前进"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
    <button onclick="qfNav.go('refresh')" title="刷新（F5）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.5V8h-4.5"/></svg></button>
    <button id="navHome" onclick="qfNav.go('home')" title="主页：返回设备列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.2 9.8V20h11.6V9.8"/></svg></button>
  </span>

  <span class="sep"></span>

  <span class="grp">
    <button onclick="qfNav.zoom('out')" title="缩小页面（Ctrl + -）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <span class="zlabel" id="zpct" title="当前页面缩放比例">100%</span>
    <button onclick="qfNav.zoom('in')" title="放大页面（Ctrl + +）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button onclick="qfNav.zoom('reset')" title="还原为 100%（Ctrl + 0）" style="font-size:12px;">还原</button>
  </span>

  <span class="sep"></span>

  <button class="probe" id="probe" title="服务器状态：检测中…"><span class="pdot"></span></button>
  <span class="pdetail" id="pdetail"></span>

  <span class="spacer"></span>

  <span class="status" id="status"><span class="dot"></span><span class="status-tx">连接断开，正在重连…</span></span>

  <button id="navHomePage" onclick="qfNav.homePage()" title="首页：概览、付费与激活、快速入口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg><span>首页</span></button>
  <button id="navFriends" onclick="qfNav.friends()" title="好友：添加好友与共享电脑，与控制台共用登录状态，无需再次登录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="8" r="3.6"/><path d="M4.6 19.6c.8-3.3 3.4-5.1 6.4-5.1s5.6 1.8 6.4 5.1"/></svg><span>好友</span></button>
  <button id="navForum" onclick="qfNav.forum()" title="论坛：使用求助、建议反馈、官方公告"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v8a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/><path d="M7.5 8.5h9M7.5 11.5h5.5"/></svg></button>
  <button onclick="qfNav.register()" title="注册新账号"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10.4" r="1.9"/><path d="M5.9 16.4c.5-1.6 1.7-2.5 3.1-2.5s2.6.9 3.1 2.5"/><path d="M14.6 9.6h3.9M14.6 12.9h3.9"/></svg></button>
  <button onclick="qfNav.openLock()" title="隐私锁：锁定电脑本地屏幕，本机使用须输入密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.8a4 4 0 0 1 7.8-1.2"/><circle cx="12" cy="15.2" r="1.6" fill="currentColor" stroke="none"/></svg></button>

  <button class="updbadge" id="updBadge" onclick="qfNav.openAbout()" title="发现新版本，点此查看更新说明并下载"><span class="udot"></span><span id="updBadgeTx">有新版</span></button>

  <button onclick="qfNav.screenshot()" title="截图（F9）：将当前控制台画面保存为图片至下载文件夹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h1.6l1.5-2.2h6.8L16.9 7h1.6A1.5 1.5 0 0 1 20 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
  <button id="themeBtn" onclick="qfNav.toggleTheme()" title="切换到深灰工具栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8a8.2 8.2 0 0 1 0 16.4z" fill="currentColor" stroke="none"/></svg></button>
  <button id="adminBtn" onclick="qfNav.openAdmin()" title="站长管理（账号管理、积分与申诉处理）" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6v5.2c0 4.6 3 7.7 7 9.3 4-1.6 7-4.7 7-9.3V6z"/><path d="M9.3 11.8l2 2 3.6-3.8"/></svg><span>管理</span></button>
  <button onclick="qfNav.openAbout()" title="关于 QFRemote（版本、服务器地址、检查服务器状态）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.2"/><path d="M12 7.6v.2"/></svg></button>

  <label class="al" title="Windows 登录后自动启动 QFRemote"><input type="checkbox" id="al"><span class="al-tx">开机自启</span></label>
  <button id="pin" onclick="qfNav.toggleTop()" title="窗口置顶（F10）：开启后 QFRemote 窗口始终位于最前"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4h5l-.8 6.2 2.8 2.8H7.5l2.8-2.8z"/><path d="M12 13v7.2"/></svg></button>
  <button id="fs" onclick="qfNav.toggleFullscreen()" title="全屏（F11）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

  <span class="sep"></span>

  <button class="winbtn" onclick="qfNav.win('min')" title="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="winbtn" onclick="qfNav.win('max')" title="最大化 / 还原"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></svg></button>
  <button class="winbtn close" onclick="qfNav.win('close')" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

  <div id="toast"></div>

<script>
  const box = document.getElementById('al');
  qfNav.getAutoLaunch().then(v => { box.checked = !!v; }).catch(() => {});
  box.addEventListener('change', () => qfNav.setAutoLaunch(box.checked));

  qfNav.getVersion().then(v => { document.getElementById('ver').textContent = 'v' + v; }).catch(() => {});

  // ---------- 主题 ----------
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    document.body.classList.toggle('theme-dark', t === 'dark');
    themeBtn.title = t === 'dark' ? '切换到亮蓝工具栏' : '切换到深灰工具栏';
  }
  qfNav.onThemeState(applyTheme);

  // ---------- 服务器状态灯 ----------
  const probeBtn = document.getElementById('probe');
  const pdetail = document.getElementById('pdetail');
  let lastProbe = null;
  let pdetailTimer = null;
  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function probeText(p) {
    if (!p || (!p.at && p.state === 'checking')) return '服务器状态：正在检测…';
    if (p.state === 'checking') return '服务器状态：检测中…（上次 ' + fmtTime(p.at) + (p.ok ? ' 可达' : ' 不可达') + '）';
    return '服务器状态：' + (p.ok ? '可达' : '不可达') + '（最近检测 ' + fmtTime(p.at) + '，' + p.detail + '）';
  }
  function renderProbe(p) {
    lastProbe = p;
    probeBtn.classList.toggle('ok', p.state === 'ok');
    probeBtn.classList.toggle('bad', p.state === 'bad');
    probeBtn.title = probeText(p) + '——点击查看最近一次检测结果';
    if (pdetail.classList.contains('show')) pdetail.textContent = probeText(p);
  }
  probeBtn.addEventListener('click', () => {
    const show = !pdetail.classList.contains('show');
    pdetail.classList.toggle('show', show);
    if (show) {
      pdetail.textContent = probeText(lastProbe);
      clearTimeout(pdetailTimer);
      pdetailTimer = setTimeout(() => pdetail.classList.remove('show'), 6000);
    }
  });
  qfNav.onProbeState(renderProbe);
  qfNav.getProbe().then(renderProbe).catch(() => {});

  // ---------- 截图反馈 ----------
  const toast = document.getElementById('toast');
  let toastTimer = null;
  qfNav.onShotFeedback((f) => {
    toast.textContent = f.text;
    toast.classList.toggle('bad', !f.ok);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4500);
  });

  // ---------- 既有状态同步 ----------
  qfNav.getUiState().then(s => {
    if (!s) return;
    document.getElementById('zpct').textContent = s.zoomPercent + '%';
    document.getElementById('fs').classList.toggle('on', !!s.fullScreen);
    document.getElementById('pin').classList.toggle('on', !!s.alwaysOnTop);
    if (s.theme) applyTheme(s.theme);
    if (s.probe) renderProbe(s.probe);
  }).catch(() => {});
  qfNav.onZoomState(p => { document.getElementById('zpct').textContent = p + '%'; });
  qfNav.onFsState(on => { document.getElementById('fs').classList.toggle('on', !!on); });
  qfNav.onTopState(on => { document.getElementById('pin').classList.toggle('on', !!on); });
  qfNav.onStatus(s => {
    document.getElementById('status').classList.toggle('show', s === 'reconnecting');
  });

  // ---------- 有新版提示徽标（v1.0.3） ----------
  const updBadge = document.getElementById('updBadge');
  const updBadgeTx = document.getElementById('updBadgeTx');
  function renderUpdate(s) {
    const show = !!(s && s.manifest && (s.phase === 'available' || s.phase === 'downloaded' || s.phase === 'download-failed'));
    updBadge.classList.toggle('show', show);
    if (show) updBadgeTx.textContent = s.phase === 'downloaded' ? '新版已下载 v' + s.manifest.version : '有新版 v' + s.manifest.version;
  }
  qfNav.onUpdateState(renderUpdate);
  qfNav.getUpdateState().then(renderUpdate).catch(() => {});

  // ---------- 当前视图高亮（2.3.0 同框集成） ----------
  if (window.qfNav && qfNav.onViewState) {
    qfNav.onViewState((k) => {
      document.getElementById('navHome').classList.toggle('on', k === 'console' || k === 'devices' || k === 'session');
      document.getElementById('navHomePage').classList.toggle('on', k === 'home');
      document.getElementById('navFriends').classList.toggle('on', k === 'friends' || k === 'chat');
      document.getElementById('navForum').classList.toggle('on', k === 'forum');
    });
  }

  // ---------- 站长管理入口（v2.2.0，仅站长可见） ----------
  const adminBtn = document.getElementById('adminBtn');
  if (window.qfNav && qfNav.onAdminState) {
    qfNav.onAdminState((on) => { adminBtn.style.display = on ? '' : 'none'; });
  }
</script>
</body>
</html>
