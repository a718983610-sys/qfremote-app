<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--surface-3); color:var(--text-1); box-sizing:border-box;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:0 12px;
    -webkit-user-select:none; user-select:none;
  }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--success); flex:none; }
  .title { font-size:14px; font-weight:600; line-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .mode { font-size:12px; line-height:18px; color:var(--text-2); white-space:nowrap; }
  .spacer { flex:1; }
  button {
    appearance:none; border:1px solid var(--btn-line); background:var(--bg2); color:var(--text-1);
    border-radius:8px; cursor:pointer; font-family:inherit; font-size:13px; line-height:20px;
    height:32px; padding:0 12px; display:flex; align-items:center; gap:6px; flex:none;
    transition: background var(--d1) var(--e-c), transform var(--d0) var(--e-s);
  }
  button:active { transform: scale(.985); }
  button:disabled { color: var(--text-disabled); }
  button:hover { background:var(--hover-ov); }
</style>
</head>
<body>
  <span class="dot"></span>
  <span class="title" id="title">远程会话</span>
  <span class="mode" id="mode"></span>
  <span class="spacer"></span>
  <button id="back" title="断开当前会话并返回设备列表">断开并返回</button>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('t') === 'dark') document.documentElement.dataset.theme = 'dark';
  const titleEl = document.getElementById('title');
  const modeEl = document.getElementById('mode');
  if (q.get('title')) titleEl.textContent = q.get('title');
  if (q.get('mode')) modeEl.textContent = q.get('mode');
  if (window.qfSessionBar) {
    qfSessionBar.onState((s) => {
      if (!s) return;
      if (s.title) titleEl.textContent = s.title;
      if (typeof s.mode === 'string') modeEl.textContent = s.mode;
    });
    qfSessionBar.onTheme((t) => {
      if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      else delete document.documentElement.dataset.theme;
    });
  }
  document.getElementById('back').addEventListener('click', () => { if (window.qfSessionBar) qfSessionBar.back(); });
</script>
</body>
</html>
