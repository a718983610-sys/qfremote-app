<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height:100%; overflow:hidden; }
  body {
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; color:var(--text-1); position:relative;
  }
  /* 重做 C §2.5：错误页给错误码 + 原因 + 已尝试步骤 + 下一步；无数据源的字段显示 — */
  .card {
    background: var(--bg2);
    border:1px solid var(--line); border-radius:16px;
    padding:32px; width:400px; box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    animation: win-in var(--d5) var(--e-l) both;
  }
  /* W4 M 档：60／圆角 14／padding 4／内图圆角 10（原 48／12／3／9） */
  .tile {
    width:60px; height:60px; border-radius:14px; padding:4px; position:relative; box-sizing:border-box;
    background: var(--tile-bg);
  }
  .tile img { width:100%; height:100%; border-radius:10px; display:block; }
  .tile .dot {
    position:absolute; right:-4px; bottom:-4px; width:10px; height:10px; border-radius:50%;
    background: var(--warning);
    border:2px solid var(--bg2);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .title { font-size:24px; font-weight:600; line-height:32px; letter-spacing:-.01em; margin-top:16px; color:var(--text-1); }
  .desc { font-size:14px; line-height:22px; color:var(--text-2); margin-top:8px; }
  .kv { width:100%; margin-top:16px; border-top:1px solid var(--line); text-align:left; }
  .kv .r { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:20px; }
  .kv .r:last-child { border-bottom:none; }
  .kv .k { color:var(--text-2); flex:none; }
  .kv .v { font-weight:500; text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; font-variant-numeric: tabular-nums; }
  .kv .v.mono { font-family:var(--font-mono); font-size:13px; line-height:20px; }
  .count { font-size:13px; line-height:20px; color:var(--text-2); margin-top:16px; min-height:18px; }
  /* Q1-2(a)（2026-11-15）：倒计时数字中性墨色，警告语义由 6px 点承载 */
  .count b { color:var(--text-1); font-weight:600; font-variant-numeric: tabular-nums; }
  .count b::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warning); margin-right:6px; vertical-align:middle; }
  .acts { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .btn {
    border:none; cursor:pointer; text-decoration:none;
    font-family:inherit; font-size:14px; font-weight:600; line-height:22px; color:var(--on-brand); letter-spacing:.01em;
    height:36px; padding:0 24px; border-radius:var(--radius-1); display:inline-flex; align-items:center; justify-content:center;
    background: var(--brand);
    transition: background var(--d1) var(--e-c), transform var(--d0) var(--e-s);
  }
  .btn:hover { background:var(--brand-press); }
  .btn:active { transform: scale(.985); }
  .btn.secondary { background:var(--bg2); color:var(--text-1); border:1px solid var(--line); }
  .btn.secondary:hover { background:var(--sel-ov); }
  .foot { font-size:12px; line-height:18px; color:var(--text-2); margin-top:16px; }
</style>
</head>
<body>
  <div class="card elev-1">
    <div class="tile"><img src="build/icon.png" alt="QFRemote"><span class="dot"></span></div>
    <div class="title">暂时连不上服务器</div>
    <div class="desc">连不上服务器，正在重试。<br>网络恢复后将自动回到控制台，无需操作。</div>
    <div class="kv">
      <div class="r"><span class="k">错误码</span><span class="v mono" id="errCode">—</span></div>
      <div class="r"><span class="k">目标地址</span><span class="v" id="targetHost">—</span></div>
      <div class="r"><span class="k">已尝试自动重试</span><span class="v" id="attempts">—</span></div>
      <div class="r"><span class="k">发生时间</span><span class="v" id="atTime">—</span></div>
    </div>
    <div class="count" id="count"></div>
    <div class="acts">
      <a class="btn" id="retry" href="#">立即重试</a>
      <button class="btn secondary" id="copyBtn" type="button">复制日志</button>
    </div>
    <div class="foot">长时间连不上，请检查本机网络后重试。</div>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('t') === 'dark') document.documentElement.dataset.theme = 'dark';
  var target = q.get('u') || 'https://app.qfremote.top/';
  var delay = parseInt(q.get('d') || '6', 10);
  if (isNaN(delay) || delay < 1) delay = 6;
  // 错误码：本页 URL 未带错误码参数，不编造（C §4：无数据 —）。
  document.getElementById('errCode').textContent = q.get('code') || '—';
  try { document.getElementById('targetHost').textContent = new URL(target).host; } catch (e) { document.getElementById('targetHost').textContent = target; }
  // 已尝试次数：本会话真实计数（sessionStorage），非编造。
  var attempts = 0;
  try { attempts = (parseInt(sessionStorage.getItem('qf-offline-attempts') || '0', 10) || 0) + 1; sessionStorage.setItem('qf-offline-attempts', String(attempts)); } catch (e) { attempts = 1; }
  document.getElementById('attempts').textContent = attempts + ' 次';
  function fmtDT(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  document.getElementById('atTime').textContent = fmtDT(new Date());
  var el = document.getElementById('count');
  var btn = document.getElementById('retry');
  btn.setAttribute('href', target);
  function go() { location.href = target; }
  btn.addEventListener('click', function (e) { e.preventDefault(); go(); });
  document.getElementById('copyBtn').addEventListener('click', function () {
    var text = 'QFRemote 断线日志\n时间：' + fmtDT(new Date()) + '\n错误码：' + (q.get('code') || '—')
      + '\n目标：' + target + '\n已尝试自动重试：' + attempts + ' 次';
    var b = document.getElementById('copyBtn');
    function done(ok) { b.textContent = ok ? '已复制' : '复制失败'; setTimeout(function () { b.textContent = '复制日志'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    else done(false);
  });
  var left = delay;
  function render() {
    el.innerHTML = '将在 <b>' + left + '</b> 秒后自动重试';
    if (left <= 0) { go(); return; }
    left--;
    setTimeout(render, 1000);
  }
  render();
</script>
</body>
</html>
