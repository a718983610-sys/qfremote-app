<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height:100%; overflow:hidden; }
  body {
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; color:var(--text-1);
    position:relative;
  }
  /* 重做 A §2.1：删装饰轨道环——启动页只留 Logo + 名称 + 2px 进度线。 */
  .col { display:flex; flex-direction:column; align-items:center; animation: win-in var(--d5) var(--e-l) both; }
  .tile {
    width:88px; height:88px; border-radius:14px; padding:5px; background:var(--tile-bg);
    box-sizing:border-box;
  }
  .tile img { width:100%; height:100%; border-radius:10px; display:block; }
  .name { font-size:24px; font-weight:600; line-height:32px; letter-spacing:1.2px; margin-top:16px; }
  .tag { font-size:12px; font-weight:500; line-height:18px; color:var(--text-2); margin-top:8px; letter-spacing:5px; }
  .bar { width:160px; height:2px; border-radius:999px; background:var(--line); margin-top:24px; overflow:hidden; }
  .bar i { display:block; height:100%; width:40px; border-radius:999px;
    background: var(--brand);
    animation: load-indet 900ms linear infinite; }
  .hint { font-size:12px; color:var(--text-2); margin-top:12px; }
  .ver { position:absolute; bottom:12px; left:0; right:0; text-align:center; font-size:12px; color:var(--text-2); letter-spacing:.6px; }
  /* 深色主题（与工具栏联动，黑底白字） */
  html[data-theme="dark"] .bar { background: var(--line-strong); }

</style>
</head>
<body>
  <div class="col">
    <div class="tile"><img src="build/icon.png" alt="QFRemote"></div>
    <div class="name">QFRemote</div>
    <div class="tag">远程控制</div>
    <div class="bar"><i></i></div>
    <div class="hint">正在连接服务器…</div>
  </div>
  <div class="ver" id="ver"></div>
<script>
  var q0 = new URLSearchParams(location.search);
  if (q0.get('t') === 'dark') document.documentElement.dataset.theme = 'dark';
  const v = q0.get('v');
  if (v) document.getElementById('ver').textContent = 'QFRemote v' + v.replace(/\.0$/, '');
</script>
</body>
</html>
