name: qfremote
description: QFRemote 远程控制 — 安卓控制端（与 Windows 版同口径的品牌外壳）
publish_to: 'none'
version: 1.0.5+10005

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.3
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  crypto: ^3.0.6
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
